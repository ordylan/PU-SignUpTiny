name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            package_name: pu-signup-tiny-linux-x64
            archive_name: pu-signup-tiny-linux-x64.zip
            binary_path: build/pu-signup-tiny
          - name: Windows x64
            os: windows-2022
            package_name: pu-signup-tiny-windows-x64
            archive_name: pu-signup-tiny-windows-x64.zip
            binary_path: build/Release/pu-signup-tiny.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev libssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare release folder
        shell: bash
        run: |
          mkdir -p "package/${{ matrix.package_name }}"
          cp "${{ matrix.binary_path }}" "package/${{ matrix.package_name }}/"
          cp config.example.json mycourse.example.json README.md LICENSE "package/${{ matrix.package_name }}/"

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: zip -r "${{ matrix.archive_name }}" "package/${{ matrix.package_name }}"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "package/${{ matrix.package_name }}" -DestinationPath "${{ matrix.archive_name }}"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
