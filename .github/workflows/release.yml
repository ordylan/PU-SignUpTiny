name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            package_name: pu-signup-tiny-linux-x64
            archive_name: pu-signup-tiny-linux-x64.zip
            binary_path: build/pu-signup-tiny
          - name: Windows x64
            os: windows-2022
            package_name: pu-signup-tiny-windows-x64
            archive_name: pu-signup-tiny-windows-x64.zip
            binary_path: build/Release/pu-signup-tiny.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev libssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          release_dir="$(mktemp -d)"
          package_path="$release_dir/${{ matrix.package_name }}"
          mkdir -p "$package_path"
          cp "${{ matrix.binary_path }}" config.example.json mycourse.example.json README.md LICENSE myqrcode.html "$package_path/"
          (cd "$release_dir" && zip -r "$GITHUB_WORKSPACE/${{ matrix.archive_name }}" "${{ matrix.package_name }}")

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "${{ matrix.package_name }}"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "${{ matrix.binary_path }}", config.example.json, mycourse.example.json, README.md, LICENSE, myqrcode.html $releaseDir -Force
          Compress-Archive -Path $releaseDir -DestinationPath "${{ matrix.archive_name }}"

      - name: Upload release archive
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
          fi
